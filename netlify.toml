# Netlify deploy: static UI + serverless "quick-rip" function.
# The full multi-page crawler needs a persistent Node host (Docker/Render/Railway)
# — Netlify functions cap at 60s, so the hosted mode rips one page + its assets.

[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # Chromium comes from @sparticuz/chromium at runtime — don't download
  # puppeteer's bundled browser during the build.
  PUPPETEER_SKIP_DOWNLOAD = "true"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium", "puppeteer", "puppeteer-core"]
